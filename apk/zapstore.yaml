# Zapstore-Listing — Alien Fitness (persönlicher Workout-Tracker, Android-Wrapper)
# Veröffentlichen:  set -a; source .env; set +a;  zsp publish zapstore.yaml
repository: https://github.com/Alien-Investor/alien-fitness
# APK von der eigenen Download-Seite (seit 01.10.2026 ab v2.8.0, Muster Alien Notes; GitHub ist nur Spiegel). Die Seite schreibt make-release.sh mit genau einem Link auf die aktuelle APK.
release_source:
  version:
    url: https://api.alien-investor.org/downloads/alien-fitness/
    selector: "a"
    match: "alien-fitness-([0-9]+(?:\\.[0-9]+)+)\\.apk"
  asset_url: https://api.alien-investor.org/downloads/alien-fitness/alien-fitness-{version}.apk
match: '.*\.apk$'
name: Alien Fitness
