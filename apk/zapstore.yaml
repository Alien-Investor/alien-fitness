summary: Minimal, offline-first personal workout tracker with plans, live logging and progress charts.

description: |
  A minimal, fully offline personal workout tracker. No account, no server, no tracking
  — all your data stays on your device and never leaves it.

  Features:
  - Training plans: strength (Push / Pull / Legs) and HIT (Tabata, Power)
  - Live session logging with automatic rest timer
  - Progress charts per exercise (max weight / reps over time)
  - Exercise library with images, muscle groups and equipment
  - JSON backup: export and import your history to move between devices
  - Dark neon UI, fully mobile-first

  Works completely offline. Built-in plans use bodyweight, pull-up bar and dumbbells —
  no gym required.

