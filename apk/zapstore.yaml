summary: Minimal, fully offline workout tracker without internet permission — custom plans, HIT intervals, live logging and progress charts.

description: |
  A minimal, fully offline workout tracker. No account, no server, no tracking
  — the APK has no internet permission at all, so your data cannot leave your device.

  Features:
  - Create your own training plans: any exercise, sets, reps and rest — edit any time
  - Ad-hoc free workouts: start empty, add exercises on the fly, save when done
  - Built-in plans: strength (Push / Pull / Legs) and HIT (Tabata, Power)
  - Live session logging with automatic rest timer, corrections supported
  - "Last time" shown and pre-filled for every set — progressive overload at a glance
  - HIT intervals: timed sets run with a work timer, rest and auto-chained next set
  - Interrupted workouts survive an app kill — resume, save or discard
  - Session details with every set, a free-text note and delete
  - Progress charts per exercise (max weight / reps or seconds over time)
  - Exercise library with images, muscle groups and equipment
  - JSON backup: export and import (merge with duplicate detection, or replace)
  - German and English interface, switchable in-app
  - Dark neon UI, screen stays awake during a workout, timer ends with beep and vibration

  Works completely offline. Built-in plans use bodyweight, pull-up bar and dumbbells —
  no gym required.

